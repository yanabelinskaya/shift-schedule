# docker-compose для разработки. Сервис web монтирует исходники проекта,
# поэтому любые изменения в файлах сразу подхватываются Django runserver
# и сохраняются на хосте (двусторонняя синхронизация через bind mount).
#
# Запуск:
#   docker compose up --build
# После первого запуска создаётся БД, применяются миграции и
# (при DJANGO_CREATE_SUPERUSER=1) автоматически создаётся admin/admin.

services:
  db:
    image: postgres:16-alpine
    container_name: shift_schedule_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shift_schedule}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт PostgreSQL не публикуется наружу, чтобы не конфликтовать
    # с локальной БД на 5432/5433. Web-контейнер подключается к db:5432
    # по внутренней сети Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-shift_schedule}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shift_schedule_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-in-env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-shift_schedule}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_COLLECTSTATIC: "0"
      DJANGO_LOAD_SEED_DATA: ${DJANGO_LOAD_SEED_DATA:-1}
      DJANGO_SEED_FIXTURE: ${DJANGO_SEED_FIXTURE:-render_data.json}
      DJANGO_CREATE_SUPERUSER: ${DJANGO_CREATE_SUPERUSER:-1}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      # Двусторонний bind mount: правки кода/шаблонов/статики на хосте
      # моментально подхватываются runserver внутри контейнера,
      # а файлы, созданные миграциями (.py в */migrations/) и медиа,
      # сохраняются обратно на хост.
      - ./:/app
      # Не пробрасываем кеш .pyc и виртуальные артефакты,
      # чтобы они не «утекали» на хост.
      - django_pycache:/app/__pycache__

volumes:
  postgres_data:
  django_pycache:
