{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Админ-консоль | Conector Shift</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}" />
</head>
<body class="dashboard-page admin-page">
  <div class="app-shell">
    <aside class="sidebar admin-sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-text">
            <div class="brand-name">Conector Shift</div>
            <div class="brand-sub">Админ-консоль</div>
          </div>
        </div>
        <button class="sidebar-toggle" type="button" data-action="toggle-sidebar" aria-label="Свернуть меню">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Разделы</div>
        <nav class="sidebar-nav">
          <a class="sidebar-link{% if active_tab == 'users' %} active{% endif %}" href="{% url 'admin-users' %}">
            <span class="nav-icon">U</span>
            Пользователи
          </a>
          <a class="sidebar-link{% if active_tab == 'departments' %} active{% endif %}" href="{% url 'admin-departments' %}">
            <span class="nav-icon">D</span>
            Отделы
          </a>
          <a class="sidebar-link{% if active_tab == 'settings' %} active{% endif %}" href="{% url 'admin-settings' %}">
            <span class="nav-icon">S</span>
            Настройки
          </a>
          <a class="sidebar-link{% if active_tab == 'reports' %} active{% endif %}" href="{% url 'admin-reports' %}">
            <span class="nav-icon">R</span>
            Отчеты
          </a>
          <a class="sidebar-link{% if active_tab == 'payroll' %} active{% endif %}" href="{% url 'admin-payroll' %}">
            <span class="nav-icon">P</span>
            Payroll
          </a>
          <a class="sidebar-link{% if active_tab == 'system' %} active{% endif %}" href="{% url 'admin-system' %}">
            <span class="nav-icon">X</span>
            Система
          </a>
        </nav>
      </div>
      
      <div class="sidebar-section">
        <div class="sidebar-label">Быстрые действия</div>
        <div class="quick-actions">
          <button class="btn btn-ghost btn-inline" type="button">Создать бэкап</button>
          <button class="btn btn-ghost btn-inline" type="button">Импорт Excel</button>
        </div>
      </div>

      <div class="sidebar-footer">
        ООО "Конектор" · Админ доступ
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="left-controls">
          <button class="icon-button sidebar-toggle-main" type="button" data-action="toggle-sidebar" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
        <div class="right-controls">
          <button class="theme-toggle" type="button" data-action="toggle-theme" aria-label="Переключить тему">
            <span class="theme-icon sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="presentation">
                <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
                <path d="M12 2.2v2.6M12 19.2v2.6M4.2 12h2.6M17.2 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"></path>
              </svg>
            </span>
            <span class="theme-icon moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="presentation">
                <path d="M20.2 14.8c-1.4.6-3 .8-4.6.4-3.6-.8-6.1-4-6-7.7.1-1.2.4-2.4 1-3.4-3.7 1-6.4 4.4-6.4 8.4 0 4.8 3.9 8.7 8.7 8.7 3.5 0 6.5-2.1 7.3-5.2z" fill="currentColor"></path>
              </svg>
            </span>
            <span class="sr-only">Переключить тему</span>
          </button>
          <a class="logout-button" href="{% url 'logout' %}" aria-label="Выйти из аккаунта">
            <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
              <path d="M10 3h5a2 2 0 0 1 2 2v4h-2V5h-5v14h5v-4h2v4a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="currentColor"></path>
              <path d="M12 12l-4-4v3H4v2h4v3l4-4z" fill="currentColor"></path>
            </svg>
            <span class="sr-only">Выйти из аккаунта</span>
          </a>
        </div>
      </header>

      <section class="content">
        {% block content %}{% endblock %}
      </section>
    </main>
  </div>

  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
